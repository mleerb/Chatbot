name: chatbot

services:
  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      BACKEND_URL: http://app:8000
    ports:
      - "127.0.0.1:18080:3000"
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: ""
      DATABASE_HOST: db
      DATABASE_PORT: "5432"
      POSTGRES_USER: chatbot
      POSTGRES_DB: chatbot
    env_file:
      - ./.env
      - ./.docker.env
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: chatbot
      POSTGRES_DB: chatbot
    env_file:
      - ./.docker.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -q -h 127.0.0.1 -p 5432"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  postgres_data:
    external: true
    name: chatbot_postgres_data
